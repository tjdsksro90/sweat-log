<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafbf9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121411" media="(prefers-color-scheme: dark)" />
    <title>오프라인 · 땀일기</title>
    <style>
      /* 오프라인에서는 globals.css를 받을 수 없어 토큰 값을 여기에 옮겨 둔다. */
      :root {
        color-scheme: light dark;
        --background: oklch(0.985 0.002 120);
        --foreground: oklch(0.18 0.01 120);
        --muted-foreground: oklch(0.5 0.01 120);
        --primary: oklch(0.88 0.2 125);
        --primary-foreground: oklch(0.18 0.02 125);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.15 0.005 120);
          --foreground: oklch(0.96 0.005 120);
          --muted-foreground: oklch(0.7 0.01 120);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--background);
        color: var(--foreground);
        font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui,
          "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
        text-align: center;
      }
      main {
        max-width: 320px;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 20px;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: var(--muted-foreground);
        font-size: 15px;
        line-height: 1.6;
      }
      button {
        margin-top: 24px;
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 999px;
        background: var(--primary);
        color: var(--primary-foreground);
        font: inherit;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>인터넷에 연결되어 있지 않아요</h1>
      <p>연결을 확인한 뒤 다시 시도해 주세요.<br />기록은 연결되면 다시 볼 수 있어요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
